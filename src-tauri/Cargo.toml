[package]
name = "timeblock-hud"
version = "0.1.0"
description = "Minimalist 3D Desktop Productivity Overlay & Time-Block HUD"
authors = ["ChronoSlab Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [ "macos-private-api", "tray-icon", "custom-protocol"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-updater = "2.14.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = false
opt-level = 3
strip = true
